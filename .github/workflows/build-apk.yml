name: Build Android APK

# Wraps the web game (cairo_microbus/) in a Capacitor Android app and builds a debug APK.
# The APK is uploaded as a workflow artifact and committed to cairo_microbus/apk/.
on:
  push:
    paths:
      - 'cairo_microbus/**'
      - '.github/workflows/build-apk.yml'
      - '!cairo_microbus/apk/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Create Capacitor project
        run: |
          mkdir -p build-apk/www
          rsync -a --exclude tools --exclude apk --exclude README.md cairo_microbus/ build-apk/www/
          cd build-apk
          cat > package.json <<'EOF'
          { "name": "cairo-microbus", "version": "1.0.0", "private": true }
          EOF
          npm install --no-audit --no-fund @capacitor/core@^6 @capacitor/cli@^6 @capacitor/android@^6 @capacitor-community/text-to-speech@^4
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.cairo.microbus",
            "appName": "ميكروباص القاهرة",
            "webDir": "www",
            "android": { "allowMixedContent": false }
          }
          EOF
          npx cap add android
          npx cap sync android

      - name: Landscape, fullscreen, keep screen on
        run: |
          cd build-apk/android/app/src/main
          sed -i 's/<activity/<activity android:screenOrientation="sensorLandscape"/' AndroidManifest.xml
          # immersive fullscreen + keep the screen awake while driving
          f=$(find java -name MainActivity.java)
          cat > "$f" <<EOF
          package com.cairo.microbus;

          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import com.getcapacitor.BridgeActivity;

          public class MainActivity extends BridgeActivity {
            @Override
            public void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              hideBars();
            }
            @Override
            public void onWindowFocusChanged(boolean hasFocus) {
              super.onWindowFocusChanged(hasFocus);
              if (hasFocus) hideBars();
            }
            private void hideBars() {
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY | View.SYSTEM_UI_FLAG_FULLSCREEN
                | View.SYSTEM_UI_FLAG_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_STABLE
                | View.SYSTEM_UI_FLAG_LAYOUT_HIDE_NAVIGATION | View.SYSTEM_UI_FLAG_LAYOUT_FULLSCREEN);
            }
          }
          EOF

      - name: Build debug APK
        run: |
          cd build-apk/android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -q
          ls -la app/build/outputs/apk/debug/

      - uses: actions/upload-artifact@v4
        with:
          name: CairoMicrobus-apk
          path: build-apk/android/app/build/outputs/apk/debug/app-debug.apk

      - name: Commit APK to the branch
        run: |
          mkdir -p cairo_microbus/apk
          cp build-apk/android/app/build/outputs/apk/debug/app-debug.apk cairo_microbus/apk/CairoMicrobus.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cairo_microbus/apk/CairoMicrobus.apk
          git commit -m "Build CairoMicrobus.apk [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q && git push && break; sleep 5; done
