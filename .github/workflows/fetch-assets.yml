name: Fetch game assets

# Downloads real Cairo recordings and foley (Freesound), the real downtown Cairo map (OpenStreetMap)
# and CC0 3D models (Poly Haven). Each group runs as its own parallel job; a final job merges the
# credits and commits everything to the branch.
# Trigger: edit cairo_microbus/tools/fetch_request.txt (space separated groups) or run manually.
on:
  push:
    paths:
      - 'cairo_microbus/tools/fetch_request.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.g.outputs.groups }}
    steps:
      - uses: actions/checkout@v4
      - id: g
        run: echo "groups=$(python3 -c "import json;print(json.dumps(open('cairo_microbus/tools/fetch_request.txt').read().split()))")" >> "$GITHUB_OUTPUT"

  fetch:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJson(needs.plan.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download ${{ matrix.group }}
        env:
          FETCH_BUDGET: '1080'
        run: python3 -u cairo_microbus/tools/fetch_assets.py ${{ matrix.group }}
      - name: Keep only new files
        run: |
          mkdir -p out
          cd cairo_microbus/assets
          git ls-files --others --exclude-standard . | while read -r f; do mkdir -p "../../out/$(dirname "$f")"; cp "$f" "../../out/$f"; done
          ls -R ../../out | head -50
      - uses: actions/upload-artifact@v4
        with:
          name: assets-${{ matrix.group }}
          path: out
          if-no-files-found: ignore

  commit:
    needs: fetch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Merge and commit
        run: |
          for d in parts/*/; do [ -d "$d" ] && cp -r "$d". cairo_microbus/assets/; done
          python3 cairo_microbus/tools/fetch_assets.py --merge
          du -sh cairo_microbus/assets/* || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cairo_microbus/assets
          git diff --cached --quiet && echo "nothing new" && exit 0
          git commit -m "Add downloaded game assets [skip ci]"
          for i in 1 2 3 4; do git pull --rebase -q && git push && exit 0; sleep 10; done
          exit 1
