<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#1b1a17">
  <title>استوديو أصوات الميكروباص</title>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    /* Studio: a recording booth — dark, warm, one big red button */
    :root {
      --bg: #1b1a17; --panel: #26241f; --line: #3a362e; --fg: #f3ede1; --muted: #a59d8c;
      --accent: #ffb300; --rec: #e53935; --ok: #66bb6a;
      --font: "Cairo", "Segoe UI", Tahoma, sans-serif;
      color-scheme: dark;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body { background: var(--bg); color: var(--fg); font-family: var(--font); display: flex; flex-direction: column; }
    header { padding: 12px 16px 8px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; border-bottom: 1px solid var(--line); }
    header h1 { margin: 0; font-size: 22px; font-weight: 900; color: var(--accent); }
    header .prog { font-variant-numeric: tabular-nums; color: var(--muted); font-size: 14px; }
    header .sp { flex: 1; }
    a.btn, button { font-family: inherit; color: inherit; border: 0; cursor: pointer; }
    .btn { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 6px 14px; font-size: 14px; text-decoration: none; }
    .btn:focus-visible, .tab:focus-visible, .row:focus-visible, #recBtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    #tabs { display: flex; gap: 6px; overflow-x: auto; padding: 8px 16px; border-bottom: 1px solid var(--line); flex-shrink: 0; }
    .tab { background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; white-space: nowrap; font-size: 13px; }
    .tab.on { border-color: var(--accent); background: rgba(255, 179, 0, 0.18); }
    .tab b { font-variant-numeric: tabular-nums; color: var(--muted); font-weight: 400; margin-inline-start: 4px; }
    main { flex: 1; display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); min-height: 0; }
    #list { overflow-y: auto; border-inline-end: 1px solid var(--line); padding: 8px 16px; }
    .row { display: flex; gap: 10px; align-items: flex-start; padding: 8px 10px; border-radius: 10px; width: 100%; text-align: right; background: none; font-size: 15px; line-height: 1.5; }
    .row:hover { background: var(--panel); }
    .row.sel { background: rgba(255, 179, 0, 0.14); }
    .row .st { width: 20px; flex-shrink: 0; color: var(--muted); }
    .row.done .st { color: var(--ok); }
    #booth { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px; padding: 16px; text-align: center; min-width: 0; }
    #who { color: var(--accent); font-weight: 700; font-size: 15px; }
    #line { font-size: clamp(22px, 4vw, 34px); font-weight: 900; line-height: 1.5; max-width: 26ch; text-wrap: balance; }
    #hint { color: var(--muted); font-size: 14px; max-width: 40ch; }
    #recBtn { width: 112px; height: 112px; border-radius: 50%; background: var(--rec); box-shadow: 0 0 0 8px rgba(229, 57, 53, 0.2); font-size: 18px; font-weight: 900; color: #fff; }
    #recBtn.live { animation: pulse 1s infinite; }
    @keyframes pulse { 50% { box-shadow: 0 0 0 18px rgba(229, 57, 53, 0.08); } }
    @media (prefers-reduced-motion: reduce) { #recBtn.live { animation: none; } }
    .ctrls { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; }
    #meter { width: 220px; height: 8px; border-radius: 4px; background: var(--panel); overflow: hidden; }
    #meter i { display: block; height: 100%; width: 0; background: var(--ok); }
    #err { color: #ff8a80; font-size: 14px; max-width: 40ch; }
    @media (max-width: 760px) {
      main { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr); }
      #booth { order: -1; border-bottom: 1px solid var(--line); gap: 10px; }
      #recBtn { width: 84px; height: 84px; }
      #list { border-inline-end: 0; }
    }
  </style>
</head>
<body>
  <header>
    <h1>🎙️ استوديو الأصوات</h1>
    <span class="prog" id="prog"></span>
    <span class="sp"></span>
    <button class="btn" id="exportBtn" title="نزّل كل التسجيلات في ملف ZIP">⬇ تصدير ZIP</button>
    <a class="btn" href="index.html">🚐 ارجع للعبة</a>
  </header>
  <nav id="tabs" aria-label="الشخصيات"></nav>
  <main>
    <div id="list" role="list"></div>
    <section id="booth">
      <div id="who"></div>
      <div id="line"></div>
      <div id="hint">دوس الزرار الأحمر وقول الجملة بإحساس الشخصية، ودوس تاني لما تخلّص. التسجيل بيتحفظ على الموبايل واللعبة بتستخدمه على طول.</div>
      <div id="meter"><i></i></div>
      <button id="recBtn">سجّل</button>
      <div class="ctrls">
        <button class="btn" id="playBtn">▶ اسمع</button>
        <button class="btn" id="delBtn">🗑 امسح</button>
        <button class="btn" id="nextBtn">الجاية ⟵</button>
      </div>
      <div id="err"></div>
    </section>
  </main>
  <script src="js/utils.js"></script>
  <script src="js/dialogs.js"></script>
  <script src="js/voicestore.js"></script>
  <script src="js/record.js"></script>
</body>
</html>
